name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate
        run: python3 build.py --validate
      - name: Build all platform bundles
        run: python3 build.py --build
      - name: Create GitHub Release with the four platform zips as assets
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          files: |
            dist/similarweb-cowork-*.zip
            dist/similarweb-claude-code-*.zip
            dist/similarweb-codex-[0-9]*.zip
            dist/similarweb-cursor-*.zip
          generate_release_notes: true
