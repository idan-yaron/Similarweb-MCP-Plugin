name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Validate
        run: python3 build.py --validate
      - name: Build all platform bundles
        run: python3 build.py --build
      - name: Create GitHub Release with the four platform zips as assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            dist/similarweb-cowork-*.zip
            dist/similarweb-claude-code-*.zip
            dist/similarweb-codex-[0-9]*.zip
            dist/similarweb-cursor-*.zip
          generate_release_notes: true
