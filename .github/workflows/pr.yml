name: PR validate + build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate (frontmatter + descriptions under cap + file presence)
        run: python3 build.py --validate
      - name: Build all platform bundles
        run: python3 build.py --build
      - name: Codex mirror must match source (rebuild produced no diff)
        run: git diff --exit-code -- .agents plugins
      - name: List build artifacts
        run: ls -la dist/
