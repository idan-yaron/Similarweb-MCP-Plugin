name: PR validate + build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Validate (frontmatter + descriptions under cap + file presence)
        run: python3 build.py --validate
      - name: Build all platform bundles
        run: python3 build.py --build
      - name: Codex mirror must match source (rebuild produced no diff)
        run: git diff --exit-code -- .agents plugins
      - name: List build artifacts
        run: ls -la dist/
