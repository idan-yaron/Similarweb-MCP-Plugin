name: PR validate + build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Validate (frontmatter + descriptions under cap + file presence)
        run: python3 build.py --validate
      - name: Build all platform bundles
        run: python3 build.py --build
      - name: Codex mirror must match source (rebuild produced no diff)
        run: git diff --exit-code -- .agents plugins
      - name: List build artifacts
        run: ls -la dist/
